name: CI & Security Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Unit Tests, Audit & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies cleanly
        run: npm ci

      - name: Run TypeScript type check
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run dependency audit (high/critical gate)
        run: npm audit --audit-level=high

      - name: Run redacted secret-pattern check on tracked source
        run: |
          set -euo pipefail
          MATCHES=$(grep -rnE '(AIza[0-9A-Za-z_-]{35}|sk-[0-9A-Za-z]{20,}|ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]+ PRIVATE KEY-----)' \
            src public index.html vite.config.ts vercel.json package.json metadata.json 2>/dev/null | cut -d: -f1,2 || true)
          if [ -n "$MATCHES" ]; then
            echo "Potential hardcoded credential detected (values redacted) at:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No known hardcoded credential patterns detected in tracked application files."

      - name: Build production bundle
        run: npm run build
