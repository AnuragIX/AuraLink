name: Secret Scanning (Gitleaks)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks binary
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -fsSL -o "/tmp/${ARCHIVE}" "${URL}"
          echo "${GITLEAKS_SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Scan Git history (redacted)
        run: |
          set -euo pipefail
          /tmp/gitleaks git --redact --config .gitleaks.toml --verbose --exit-code 1

      - name: Scan tracked and hidden workspace files (redacted)
        run: |
          set -euo pipefail
          /tmp/gitleaks dir --redact --config .gitleaks.toml --verbose --exit-code 1 .
