title = "AuraLink AI Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Allowlist strictly documented placeholder values in .env.example and package-lock integrity hashes"
paths = [
  '''package-lock\.json$''',
  '''bun\.lock$'''
]
regexes = [
  '''MY_GEMINI_API_KEY''',
  '''MY_APP_URL'''
]
